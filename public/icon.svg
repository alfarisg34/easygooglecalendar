<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Titanium Cockpit Chassis Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <!-- Signal Amber Gradient (Primary Accent) -->
    <linearGradient id="amberGrad" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E0B" />
      <stop offset="100%" stop-color="#FFB94D" />
    </linearGradient>

    <!-- Cyan Telemetry AI Gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Subtle Amber Glow -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Chassis (ensures high contrast in both dark & light browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#273344" stroke-width="2.2" />

  <!-- Inner Calendar Body Surface -->
  <rect x="9" y="14" width="46" height="40" rx="7" fill="#121822" stroke="#253245" stroke-width="1.6" />

  <!-- Calendar Top Header Accent (Signal Amber Bar) -->
  <path d="M9 21C9 17.134 12.134 14 16 14H48C51.866 14 55 17.134 55 21V26H9V21Z" fill="url(#amberGrad)" />

  <!-- Metallic Binder Loops (Twin Steel Rings) -->
  <rect x="18" y="8" width="6" height="11" rx="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.4" />
  <rect x="40" y="8" width="6" height="11" rx="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.4" />

  <!-- AI Multimodal Gemini Sparkle (Top Right of Calendar Body) -->
  <path d="M44 32C44 34.8 45.8 36.8 48.5 36.8C45.8 36.8 44 38.8 44 41.5C44 38.8 42.2 36.8 39.5 36.8C42.2 36.8 44 34.8 44 32Z" fill="url(#cyanGrad)" />

  <!-- Subtle Schedule Dots -->
  <circle cx="18" cy="34" r="2.2" fill="#334155" />
  <circle cx="27" cy="34" r="2.2" fill="#334155" />

  <!-- Verified Calendar Event Checkmark (Signal Amber with Glow) -->
  <path d="M16 43L24 50.5L39 35.5" stroke="url(#amberGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)" />
</svg>